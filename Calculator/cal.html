<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Tahoma,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#2c2f36,#0f1115);
}

.calculator{
    width:320px;
    padding:22px;
    border-radius:16px;
    background:#14161c;
    box-shadow:0 20px 40px rgba(0,0,0,.6);
}

.display{
    width:100%;
    height:65px;
    margin-bottom:18px;
    padding:12px;
    font-size:28px;
    text-align:right;
    border:none;
    border-radius:10px;
    background:#0b0d12;
    color:#eaeaea;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:55px;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    color:#eaeaea;
    background:#2a2d34;
    transition:.2s;
}

button:hover{background:#343844;}

.num{background:#252831;}
.operator{background:#3a3f4b;color:#7fb7ff;}
.clear{background:#3a1f1f;color:#ff6b6b;}
.equal{
    background:linear-gradient(135deg,#1f6feb,#174ea6);
    grid-row:span 2;
}
.zero{grid-column:span 2;}
.delete{background:#2f2a1f;color:#ffcc66;}
</style>
</head>

<body>

<div class="calculator">
    <input type="text" id="display" class="display" readonly>

    <div class="buttons">
        <button class="clear" onclick="allClear()">AC</button>
        <button class="delete" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="append('/')">÷</button>
        <button class="operator" onclick="append('*')">×</button>

        <button class="num" onclick="append('7')">7</button>
        <button class="num" onclick="append('8')">8</button>
        <button class="num" onclick="append('9')">9</button>
        <button class="operator" onclick="append('-')">−</button>

        <button class="num" onclick="append('4')">4</button>
        <button class="num" onclick="append('5')">5</button>
        <button class="num" onclick="append('6')">6</button>
        <button class="operator" onclick="append('+')">+</button>

        <button class="num" onclick="append('1')">1</button>
        <button class="num" onclick="append('2')">2</button>
        <button class="num" onclick="append('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="num zero" onclick="append('0')">0</button>
        <button class="num" onclick="append('.')">.</button>
    </div>
</div>

<script>
const display=document.getElementById("display");

function append(v){display.value+=v;}
function allClear(){display.value="";}
function deleteLast(){display.value=display.value.slice(0,-1);}
function calculate(){
    try{display.value=Function("return "+display.value)();}
    catch{display.value="Error";}
}
</script>

</body>
</html>
